<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Forgery Detection (ELA)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 60%;
            margin: 60px auto;
            background-color: #ffffff;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            padding: 40px;
            border-radius: 12px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        form {
            margin-bottom: 30px;
        }

        input[type="file"] {
            padding: 10px;
            margin-bottom: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        input[type="submit"] {
            background-color: #007BFF;
            border: none;
            color: white;
            padding: 12px 25px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
        }

        h3 {
            color: #333;
        }

        img {
            margin-top: 15px;
            border-radius: 8px;
            max-width: 100%;
            height: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Upload an Image for ELA Analysis</h2>
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="image" required>
            <input type="submit" value="Analyze">
        </form>

        {% if result_image %}
            <h3>ELA Result:</h3>
            <img src="{{ url_for('static', filename='results/' + result_image.split('/')[-1]) }}" alt="ELA Output">
        {% endif %}
    </div>
</body>
</html>
